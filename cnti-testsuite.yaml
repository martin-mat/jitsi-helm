---
# CNTi Test Suite configuration for the Jitsi Meet chart in this repository.
config_version: "v2"
common:
  container_names:
    # Every component's container is named jitsi-meet and all images share
    # one stable-* tag, so one entry covers the rolling update, downgrade
    # and rollback tests; the chart's appVersion is the tag under test.
    - name: jitsi-meet
      rolling_update_test_tag: "stable-11146-2"
      rolling_downgrade_test_tag: "stable-11146"
      rolling_version_change_test_tag: "stable-11146-2"
      rollback_from_tag: "stable-11146-2"
deployments:
  helm_dirs:
    - name: jitsi-meet
      helm_directory: .
      namespace: jitsi-cnti
      # helm_values is passed to Helm as is, relative to the directory the
      # suite runs in: the workflow checks this repository out into chart/.
      helm_values: --values chart/ci/cnti-values.yaml
