# Installs the chart on a kind cluster every night, runs the CNTi Test
# Suite's cert tests against it and publishes the result as the badge in
# the README. The workflow does not write to this repository: the badge is
# GitHub's own workflow badge. https://github.com/lfn-cnti/testsuite-action
name: CNTi cert

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: cnti-cert-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cert:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: lfn-cnti/testsuite-action@05a9860905f31c6813f735d25e5cefd7c62a1e5a # v1.1.0
        with:
          version: v2.1.0
          cnf_config: .github/cnti/cnti-testsuite.yaml
          tests: cert

      - name: Diagnostics
        if: failure()
        run: |
          set +e
          kubectl get pods -A -o wide
          kubectl get events -n jitsi-cnti --sort-by=.lastTimestamp | tail -40
