name: CNTi cert

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: cnti-cert
  cancel-in-progress: false

jobs:
  cert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The chart is the repository root; checking it out into a
      # subdirectory keeps the suite's cnti/ workspace outside the chart.
      - uses: actions/checkout@v4
        with:
          path: chart

      - uses: lfn-cnti/testsuite-action@v1
        with:
          # Pinned so a run is reproducible and a suite release is adopted on
          # purpose; bump it after checking the release notes.
          version: v2.0.0
          cnf_config: chart/cnti-testsuite.yaml
          tests: cert
